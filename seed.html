        async function seedDatabase() {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = 'Starting...<br>';
            
            const lines = rawData.trim().split('\n');
            statusEl.innerHTML += `Found ${lines.length} lines.<br>`;
            
            // Firestore batches allow 500 writes per batch. We have ~300 so one batch is fine.
            const batch = writeBatch(db);
            let count = 0;

            for (const line of lines) {
                const parts = line.trim().split(' ');
                if (parts.length >= 2) {
                    const code = parts[0].trim().toUpperCase();
                    const name = parts.slice(1).join(' ').trim();
                    
                    if (code.startsWith('DCA')) {
                        const caRef = doc(db, 'ambassadors', code);
                        batch.set(caRef, {
                            code: code,
                            name: name,
                            college: '', // Default empty college
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                        count++;
                    }
                }
            }

            statusEl.innerHTML += `Adding ${count} Campus Ambassadors to batch...<br>`;
            
            try {
                await batch.commit();
                statusEl.innerHTML += `<strong style="color: green;">Success! ${count} Ambassadors added to Firestore.</strong><br>`;
                statusEl.innerHTML += `You can now close this tab and refresh the main dashboard.`;
            } catch (e) {
                statusEl.innerHTML += `<strong style="color: red;">Error writing batch: ${e.message}</strong><br>`;
                console.error(e);
            }
        }

        window.onload = seedDatabase;
